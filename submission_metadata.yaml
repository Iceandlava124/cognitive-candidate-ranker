  - "Cursor"

ai_usage_summary: |
  Used Gemini for code design, logical honeypot heuristics verification, and building the dynamic sentence generator lexicon. No candidate data was shared with any external network.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Zero-dependency streaming pipeline with multi-stage alignment. Sanitizes logical honeypots (experience vs tenure/age) and enforces a 5-year minimum on product-specific experience (excluding consulting/IT services like TCS, Wipro, Infosys). Relevance is scored via title matching (ML/AI engineering focus), keyword mining in historical descriptions (identifying hidden Tier-5 search engineers), and core skill weights. Scores are scaled by a behavioral multiplier (recency, response rates, and notice periods) and sorted descending, breaking ties using open-to-work flags and GitHub activity. A dynamic, template-free text generator constructs reasoning with specific facts and honest gaps.

